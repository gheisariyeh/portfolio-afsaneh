<header class="navbar">

  <div class="navbar__inner">

    <a href="#" class="navbar__brand" (click)="closeMenu()">
      <span>Afsaneh</span>
      <strong>Gheisariyeh</strong>
    </a>

    <nav class="navbar__links" aria-label="Navigation principale">
      <a href="#about">À propos</a>

      <a href="#journey">Parcours</a>

      target="_blank"
      rel="noopener noreferrer"
      class="navbar__github"
    >
      GitHub

      class="navbar__menu-button"
      type="button"

  </div>
